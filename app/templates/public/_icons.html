{# Small inline stroke icons for the public booking flow. Usage: {{ icon('check') }} #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'x' %}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == 'shield' %}<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'card' %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/>
{%- elif name == 'wallet' %}<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M4 7l11-3v3M16 14h2"/>
{%- elif name == 'live' %}<circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4"/>
{%- elif name == 'refund' %}<path d="M4 12a8 8 0 108-8H7"/><path d="M10 1L7 4l3 3"/>
{%- elif name == 'car' %}<path d="M5 16l1.5-5a2 2 0 012-1.5h7a2 2 0 012 1.5L19 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="18" r=".6"/><circle cx="16.5" cy="18" r=".6"/>
{%- elif name == 'qr' %}<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2M14 20h2M20 14v2"/>
{%- elif name == 'bus' %}<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M7 20v-3M17 20v-3"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/>
{%- elif name == 'roof' %}<path d="M3 11l9-7 9 7"/><path d="M5 10v9M19 10v9"/><path d="M8 19v-4a1 1 0 011-1h6a1 1 0 011 1v4"/>
{%- elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.4 0 4 1.7 4 4.5"/>
{%- elif name == 'calendar' %}<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/>
{%- elif name == 'pin' %}<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>
{%- elif name == 'phone' %}<path d="M5 4h4l1.5 4-2 1.3a11 11 0 006.2 6.2L16 13.5l4 1.5v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/>
{%- elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/>
{%- elif name == 'loop' %}<path d="M4 12a8 8 0 0113.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 01-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/>
{%- elif name == 'plane' %}<path d="M3 13l7-1.5L6 5l2-.7 6.5 5.2L19 8.4c1.6-.5 2.6.8 1.2 1.9l-4.4 2.4 1 6.4-1.6.6-3.2-5.2L5 16z"/>
{%- elif name == 'instagram' %}<rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.6" cy="7.4" r=".7"/>
{%- elif name == 'facebook' %}<path d="M14 8.5h2.5V5H14a3.5 3.5 0 00-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.3l.5-3.5H14V9a.5.5 0 01.5-.5z"/>
{%- elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- endif -%}
</svg>
{%- endmacro %}
