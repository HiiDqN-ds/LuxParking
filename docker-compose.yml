# Local stack: docker compose up --build   ->  http://localhost:10000/admin/login
# Postgres for data, Redis so live map updates reach every web worker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: parkpilot
      POSTGRES_USER: parkpilot
      POSTGRES_PASSWORD: parkpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkpilot -d parkpilot"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["10000:10000"]
    environment:
      APP_ENV: development            # plain-HTTP cookies for local use; production uses "production"
      SECRET_KEY: local-only-change-me
      DATABASE_URL: postgresql://parkpilot:parkpilot@db:5432/parkpilot
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/0
      AUTO_SEED: "1"
      SEED_OWNER_EMAIL: owner@example.com
      ADMIN_PASSWORD: change-me-too-please
    env_file:
      - path: .env
        required: false
volumes:
  pgdata:
